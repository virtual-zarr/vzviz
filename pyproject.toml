[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/docs",
]

[project]
name = "vzviz"
dynamic = ["version"]
description = "Visualization tools for VirtualiZarr chunk manifests"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["virtualizarr", "zarr", "visualization", "chunks", "vzviz"]
authors = [
  { name = "Max Jones", email = "14077947+maxrjones@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "virtualizarr>=1.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "param>=2.0",
  "holoviews>=1.18",
  "bokeh>=3.0",
  "panel>=1.0",
]

[project.urls]
Issues = "https://github.com/virtual-zarr/vzviz/issues"
Source = "https://github.com/virtual-zarr/vzviz"

[dependency-groups]
dev = [
  "ipykernel>=6.29.5",
  "pytest",
  "pytest-cov",
  "coverage",
  "mypy",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch]
version.source = "vcs"

[tool.hatch.version.raw-options]
root = "."

[tool.hatch.build]
hooks.vcs.version-file = "src/vzviz/_version.py"

[tool.coverage.run]
source_pkgs = ["vzviz", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
vzviz = ["src/vzviz", "*/vzviz/src/vzviz"]
tests = ["tests", "*/vzviz/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
