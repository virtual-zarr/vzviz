[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/docs",
]

[project]
name = "virtualizarr-viz"
dynamic = ["version"]
description = "Visualization tools for VirtualiZarr chunk manifests"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["virtualizarr", "zarr", "visualization", "chunks"]
authors = [
  { name = "Max Jones", email = "14077947+maxrjones@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "virtualizarr>=1.0",
  "pandas>=2.0",
  "numpy>=1.24",
]

[project.scripts]
virtualizarr-viz = "virtualizarr_viz.cli:main"

[project.urls]
Issues = "https://github.com/virtual-zarr/virtualizarr-viz/issues"
Source = "https://github.com/virtual-zarr/virtualizarr-viz"

[dependency-groups]
holoviews = [
  "holoviews>=1.18",
  "hvplot>=0.9",
  "bokeh>=3.0",
  "panel>=1.0",
]
matplotlib = [
  "matplotlib>=3.7",
]
test = [
  "coverage",
  "pytest",
  "pytest-cov",
  "mypy",
]
dev = [
  "ipykernel>=6.29.5",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch]
version.source = "vcs"

[tool.hatch.version.raw-options]
root = "."

[tool.hatch.build]
hooks.vcs.version-file = "src/virtualizarr_viz/_version.py"

[tool.coverage.run]
source_pkgs = ["virtualizarr_viz", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
virtualizarr_viz = ["src/virtualizarr_viz", "*/virtualizarr-viz/src/virtualizarr_viz"]
tests = ["tests", "*/virtualizarr-viz/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
